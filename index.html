<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy bizbizday 💖</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at top, #0b0b1e, #000);
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  text-align: center;
}

/* Stars */
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  animation: twinkle 3s infinite;
}
@keyframes twinkle {
  0%,100%{opacity:0;}
  50%{opacity:1;}
}

/* Container */
.container {
  position: relative;
  z-index: 10;
  padding-top: 50px;
}

h1 {
  font-size: 3rem;
  color: #ff4d6d;
  text-shadow: 0 0 15px #ff4d6d;
}

img {
  width: 80%;
  max-width: 300px;
  border-radius: 20px;
  margin-bottom: 20px;
}

/* Intro */
.intro-text {
  max-width:600px;
  margin:20px auto;
  font-size:1.2rem;
  line-height:1.6;
}

/* Buttons */
.gift-button {
  display: block;
  margin: 15px auto;
  padding: 15px 25px;
  font-size: 1.2rem;
  font-weight: bold;
  border: none;
  border-radius: 25px;
  cursor: pointer;
}

.poetry { background:#ff6b81; color:white; }
.story { background:#fcd34d; color:black; }
.reel { background:#dc2743; color:white; }
.secret { background:#6a0dad; color:white; }
.lucky { background:gold; color:black; }
.last { background:#1e90ff; color:white; }

/* Cake */
.cake {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 20px auto;
  max-width: 280px;
}

.candle {
  width: 10px;
  height: 40px;
  background: orange;
  position: relative;
  cursor: pointer;
}

.flame {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 14px;
  background: gold;
  border-radius: 50%;
}

/* Video Overlay */
#videoOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#videoOverlay.show {
  display: flex;
}

#videoOverlay iframe,
#videoOverlay video {
  width: 90%;
  height: 90%;
}
</style>
</head>

<body>

<div class="container">

<h1>Happy 23rd, Katkouta 💖</h1>

<img src="Us.jpg" alt="Us">

<div class="cake" id="cake"></div>

<div class="intro-text">
note: shake your phone :)<br><br>
Since we cannot meet, this is my virtual gift to you.<br><br>
Every year matters.<br>
So do you.
</div>

<a href="https://docs.google.com/document/d/1Lt8xaQHEnwsDcisuQUpw1Koa3Ix7w3FZJg90FKUZ6lc/edit" target="_blank" class="gift-button poetry">THE book</a>

<a href="https://amapof.us/map?mou=c2de91a8-aa47-4f8b-9224-ab949def7dfd" target="_blank" class="gift-button story">The beginning of the story</a>

<a href="https://www.instagram.com/reel/DSk6MniAhhm/" target="_blank" class="gift-button reel">He said it not me 🤷🏽‍♂️</a>

<a href="secret.html" class="gift-button secret">no hard feelings ❤️</a>

<button class="gift-button" onclick="playMusic()">💖 Tap to play the 8nee 💖</button>

<button class="gift-button lucky" onclick="playLucky()">🎉 just how??? 🎉</button>

<button class="gift-button last" onclick="openLast()">open me last 🎬</button>

</div>

<audio id="music" src="birthday.mp3"></audio>

<!-- Overlay -->
<div id="videoOverlay"></div>

<script>
/* Music */
function playMusic(){
  document.getElementById("music").play();
}

/* Candles */
const cake = document.getElementById("cake");
for(let i=0;i<23;i++){
  const c = document.createElement("div");
  c.className = "candle";
  const f = document.createElement("div");
  f.className = "flame";
  c.appendChild(f);
  c.onclick = ()=>f.style.display="none";
  cake.appendChild(c);
}

/* Stars */
setInterval(()=>{
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),3000);
},200);

/* JUST HOW??? → LOCAL MP4 */
function playLucky(){
  const o=document.getElementById("videoOverlay");
  o.innerHTML = `
    <video src="surprise.mp4" controls autoplay></video>
  `;
  o.classList.add("show");
}

/* OPEN ME LAST → GOOGLE DRIVE */
function openLast(){
  const o=document.getElementById("videoOverlay");
  o.innerHTML = `
    <iframe src="https://drive.google.com/file/d/1Y-IHlBCgHdpD06RAd2xeVEjQXR6T90BE/preview" allowfullscreen></iframe>
  `;
  o.classList.add("show");
}

/* Close overlay */
document.getElementById("videoOverlay").onclick = function(){
  this.classList.remove("show");
  this.innerHTML = "";
};
</script>

</body>
</html>
